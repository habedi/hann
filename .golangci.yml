version: "2"
linters:
  enable:
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - godot
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - thelper
    - unconvert
    - unparam
    - wastedassign
  settings:
    gocritic:
      disabled-checks:
        - captLocal
    govet:
      enable:
        - nilness
    staticcheck:
      checks: ["all"]
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - unparam
        path: _test\.go
      - linters:
          - godot
        source: ";$"
    paths:
      - example/cmd
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
